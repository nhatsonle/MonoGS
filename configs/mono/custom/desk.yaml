inherit_from: "configs/mono/tum/base_config.yaml"

# Self-recorded monocular desk sequence (iOS Stray Scanner / ARKit export).
# RGB was recorded at 1920x1440 @ 30fps and extracted to rgb/*.jpg at 640x480
# (aspect ratio preserved), so the intrinsics below are the camera_matrix.csv
# values divided by 3. No GT poses / LiDAR depth are used in monocular mode.
Dataset:
  type: 'stray_scanner'
  sensor_type: 'monocular'
  dataset_path: "datasets/f0a37d9052/f0a37d9052"
  num_frames: -1
  Calibration:
    fx: 449.71237
    fy: 449.71237
    cx: 319.86344
    cy: 242.50430
    k1: 0.0
    k2: 0.0
    p1: 0.0
    p2: 0.0
    k3: 0.0
    width: 640
    height: 480
    distorted: False
