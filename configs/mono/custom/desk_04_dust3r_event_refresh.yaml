inherit_from: "configs/mono/custom/desk.yaml"

# Config 04 — DUSt3R single-view init + event-driven refresh, on the
# self-recorded desk sequence. Same shared tuning as the TUM fr2/fr3 config-04
# runs via the "event_refresh" preset (utils/config_presets.py); only the
# dataset/calibration differ (inherited from desk.yaml).
#
# NOTE: the "event_refresh" preset ships with dust3r.enabled = False (its
# documented "master switch" default). The TUM config-04 YAMLs never flip it
# back on, so as-shipped they run as baseline MonoGS. Here we enable it
# explicitly so DUSt3R actually drives initialization + refresh.
preset: event_refresh

Training:
  mapping_itr_num: 150
  lifecycle:
    enabled: False
  dust3r:
    enabled: True
    checkpoint: "checkpoints/DUSt3R_ViTLarge_BaseDecoder_512_dpt.pth"
    device: "cuda"
    image_size: 512
    batch_size: 1

Results:
  # Headless run that still reports PSNR/SSIM/LPIPS and dumps rendered images.
  save_results: True      # needed so a save_dir exists for the rendered images
  save_trj: False         # no GT poses -> skip periodic ATE logging during the run
  use_gui: False          # no GUI window
  eval_rendering: True    # after SLAM: render kf/non-kf frames, compute PSNR, save images
  color_refinement: True  # extra global color pass -> "Before"/"After" metrics (set False to skip/speed up)
  use_wandb: False
